<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earth — Blue Marble / Night Lights Globe</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000005; overflow: hidden; }
  #app { position: absolute; inset: 0; }
  canvas { display: block; }
  .panel {
    position: absolute; z-index: 10; left: 50%; transform: translateX(-50%);
    bottom: 22px; color: #dfe6f2; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 12px; text-align: center; opacity: 0.75; letter-spacing: 0.02em;
    background: rgba(10,12,20,0.5); padding: 8px 16px; border-radius: 20px; backdrop-filter: blur(4px);
  }
  #apod {
    position: absolute; z-index: 10; top: 16px; right: 16px; width: 190px;
    background: rgba(10,12,20,0.82); color: #e8ecf3; border-radius: 12px;
    padding: 10px; font-size: 11px; font-family: -apple-system, sans-serif;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5); display: none;
  }
  #apod img { width: 100%; border-radius: 8px; display: block; margin-bottom: 6px; }
  #apod.show { display: block; }
</style>
</head>
<body>
<div id="app"></div>
<div class="panel">drag to rotate · scroll to zoom</div>
<div id="apod"></div>

<!-- Optional local config with your NASA API key. Not committed to git (see .gitignore). -->
<script src="config.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
  const TEX = 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/textures/planets/';

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 0, 3.2);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.getElementById('app').appendChild(renderer.domElement);

  // Starfield backdrop
  const starGeo = new THREE.BufferGeometry();
  const starCount = 2000;
  const starPos = new Float32Array(starCount * 3);
  for (let i = 0; i < starCount * 3; i++) starPos[i] = (Math.random() - 0.5) * 200;
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
  scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.4 })));

  const loader = new THREE.TextureLoader();
  loader.setCrossOrigin('anonymous');

  // --- Earth: day map + specular ocean shine + night lights glowing through on the dark side ---
  const earth = new THREE.Mesh(
    new THREE.SphereGeometry(1, 96, 96),
    new THREE.MeshPhongMaterial({
      map: loader.load(TEX + 'earth_atmos_2048.jpg'),
      specularMap: loader.load(TEX + 'earth_specular_2048.jpg'),
      specular: new THREE.Color(0x555566),
      shininess: 14,
      emissiveMap: loader.load(TEX + 'earth_lights_2048.png'),
      emissive: new THREE.Color(0xffffff),
      emissiveIntensity: 1.3
    })
  );
  scene.add(earth);

  // --- Clouds, slightly larger, drifting independently ---
  const clouds = new THREE.Mesh(
    new THREE.SphereGeometry(1.01, 96, 96),
    new THREE.MeshPhongMaterial({
      map: loader.load(TEX + 'earth_clouds_1024.png'),
      transparent: true,
      opacity: 0.35,
      depthWrite: false
    })
  );
  scene.add(clouds);

  // --- Atmosphere glow (fresnel-style rim light) ---
  const atmosphere = new THREE.Mesh(
    new THREE.SphereGeometry(1.06, 64, 64),
    new THREE.ShaderMaterial({
      vertexShader: `
        varying vec3 vNormal;
        void main() {
          vNormal = normalize(normalMatrix * normal);
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }`,
      fragmentShader: `
        varying vec3 vNormal;
        void main() {
          float intensity = pow(0.68 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 3.0);
          gl_FragColor = vec4(0.35, 0.65, 1.0, 1.0) * intensity;
        }`,
      blending: THREE.AdditiveBlending,
      side: THREE.BackSide,
      transparent: true
    })
  );
  scene.add(atmosphere);

  // --- Lighting: one "sun" so half the globe is naturally day, half naturally night ---
  const sun = new THREE.DirectionalLight(0xffffff, 1.4);
  sun.position.set(5, 2, 5);
  scene.add(sun);
  scene.add(new THREE.AmbientLight(0x222233)); // faint fill so the night side isn't pure black

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 1.4;
  controls.maxDistance = 8;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.5;

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  function animate() {
    requestAnimationFrame(animate);
    clouds.rotation.y += 0.0006;
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  // --- Optional bonus: NASA Astronomy Picture of the Day, using your local API key ---
  async function loadApod() {
    if (typeof window.NASA_API_KEY !== 'string' || !window.NASA_API_KEY || window.NASA_API_KEY.includes('YOUR_API_KEY')) return;
    try {
      const res = await fetch(`https://api.nasa.gov/planetary/apod?api_key=${window.NASA_API_KEY}`);
      if (!res.ok) throw new Error('APOD request failed');
      const data = await res.json();
      if (data.media_type === 'image') {
        const box = document.getElementById('apod');
        box.innerHTML = `<img src="${data.url}" alt=""><strong>${data.title}</strong>`;
        box.classList.add('show');
      }
    } catch (e) {
      console.warn('NASA APOD bonus panel unavailable:', e.message);
    }
  }
  loadApod();
</script>
</body>
</html>
